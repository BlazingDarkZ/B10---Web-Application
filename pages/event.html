<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CampusHub - Event Details</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>


<header class="site-header">

    <nav class="navbar">

        <a
            href="../index.html"
            class="logo"
        >
            CAMPUS<span>HUB</span>
        </a>


        <div class="nav-links">

            <a href="../index.html">
                Events
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="my-registrations.html">
                My Registrations
            </a>

            <a href="login.html">
                Login
            </a>

        </div>

    </nav>

</header>


<main>

<section class="events-section">

<div class="container">


<div id="eventContainer">


    <!-- Event information is inserted here
         dynamically using JavaScript. -->


</div>


</div>

</section>

</main>


<footer class="site-footer">

<div class="container">

    <strong class="footer-logo">
        CAMPUS<span>HUB</span>
    </strong>

    <p>
        University events and workshops.
    </p>

</div>

</footer>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="../js/data.js"></script>

<script src="../js/storage.js"></script>

<script src="../js/events.js"></script>


<script>

$(document).ready(function () {


    const params =
        new URLSearchParams(
            window.location.search
        );


    const eventId =
        params.get("id");


    const container =
        $("#eventContainer");


    /*
        No event ID.
    */

    if (!eventId) {

        container.append(

            $("<div>")
                .addClass("form-card")
                .append(
                    $("<h1>")
                        .text(
                            "Event not found"
                        )
                )
                .append(
                    $("<p>")
                        .text(
                            "No event was selected."
                        )
                )

        );

        return;
    }


    const events =
        getEvents();


    const event =
        events.find(
            function (item) {

                return String(item.id) ===
                    String(eventId);

            }
        );


    /*
        Event does not exist.
    */

    if (!event) {

        container.append(

            $("<div>")
                .addClass("form-card")
                .append(
                    $("<h1>")
                        .text(
                            "Event not found"
                        )
                )
                .append(
                    $("<p>")
                        .text(
                            "This event no longer exists."
                        )
                )

        );

        return;
    }


    const currentUser =
        getCurrentUser();


    /*
        Main event card
    */

    const card =
        $("<article>")
            .addClass("form-card");


    /*
        Category
    */

    $("<p>")
        .addClass("eyebrow")
        .text(event.category)
        .appendTo(card);


    /*
        Title
    */

    $("<h1>")
        .text(event.title)
        .appendTo(card);


    /*
        Description
    */

    $("<p>")
        .text(event.description)
        .appendTo(card);


    /*
        Event information
    */

    const information =
        $("<div>")
            .addClass("event-information");


    $("<p>")
        .text(
            "Date: " + event.date
        )
        .appendTo(information);


    $("<p>")
        .text(
            "Time: " + event.time
        )
        .appendTo(information);


    $("<p>")
        .text(
            "Location: " + event.location
        )
        .appendTo(information);


    $("<p>")
        .text(
            "Department: " +
            event.department
        )
        .appendTo(information);


    $("<p>")
        .text(
            "Created by: " +
            event.ownerUsername
        )
        .appendTo(information);


    card.append(information);


    /*
        Buttons
    */

    const actions =
        $("<div>")
            .addClass("form-actions");


    /*
        STUDENT
        Register button
    */

    if (
        currentUser.role === "student"
    ) {

        const registerButton =
            $("<a>")
                .attr(
                    "href",
                    "register.html?eventId=" +
                    event.id
                )
                .addClass(
                    "primary-button"
                )
                .text(
                    "Register"
                );


        actions.append(
            registerButton
        );

    }


    /*
        OWNER OR ADMIN
        Edit + Delete
    */

    if (
        canManageEvent(
            event,
            currentUser
        )
    ) {


        const editButton =
            $("<a>")
                .attr(
                    "href",
                    "event-form.html?id=" +
                    event.id
                )
                .addClass(
                    "secondary-button"
                )
                .text(
                    "Edit"
                );


        actions.append(
            editButton
        );


        const deleteButton =
            $("<button>")
                .attr(
                    "type",
                    "button"
                )
                .addClass(
                    "secondary-button"
                )
                .text(
                    "Delete"
                );


        deleteButton.on(
            "click",
            function () {


                const confirmed =
                    confirm(
                        "Are you sure you want to delete this event?"
                    );


                if (!confirmed) {
                    return;
                }


                const success =
                    deleteEvent(
                        event.id
                    );


                if (success) {

                    window.location.href =
                        "../index.html";

                } else {

                    alert(
                        "You do not have permission to delete this event."
                    );

                }

            }
        );


        actions.append(
            deleteButton
        );

    }


    /*
        GUEST
    */

    if (
        currentUser.role === "guest"
    ) {

        const loginMessage =
            $("<p>")
                .text(
                    "Please log in as a student to register for this event."
                );


        actions.append(
            loginMessage
        );

    }


    card.append(actions);


    container.append(card);


    /*
        jQuery visual effect.
    */

    card.hide().fadeIn(400);

});

</script>


</body>

</html>
