<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Event Details - CampusHub</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >
</head>

<body>

<header class="site-header">

    <nav class="navbar">

        <a
            href="../index.html"
            class="logo"
        >
            CAMPUS<span>HUB</span>
        </a>

        <div class="nav-links">

            <a href="../index.html">
                Events
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="login.html">
                Login
            </a>

        </div>

    </nav>

</header>


<main>

<section class="events-section">

<div class="container">

    <div id="eventContainer"></div>

</div>

</section>

</main>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="../js/security.js"></script>
<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/events.js"></script>


<script>

$(document).ready(function () {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const eventId =
        params.get("id");


    const event =
        getEvents().find(
            function (item) {

                return (
                    String(item.id) ===
                    String(eventId)
                );

            }
        );


    const container =
        $("#eventContainer");


    if (!event) {

        container.append(

            $("<div>")
                .addClass("form-card")
                .append(
                    $("<h1>")
                        .text(
                            "Event not found"
                        )
                )

        );

        return;

    }


    const user =
        getCurrentUser();


    const card =
        $("<article>")
            .addClass("form-card");


    $("<p>")
        .addClass("eyebrow")
        .text(event.category)
        .appendTo(card);


    $("<h1>")
        .text(event.title)
        .appendTo(card);


    $("<p>")
        .text(event.description)
        .appendTo(card);


    $("<p>")
        .text(
            "Date: " +
            event.date
        )
        .appendTo(card);


    $("<p>")
        .text(
            "Time: " +
            event.time
        )
        .appendTo(card);


    $("<p>")
        .text(
            "Location: " +
            event.location
        )
        .appendTo(card);


    $("<p>")
        .text(
            "Department: " +
            event.department
        )
        .appendTo(card);


    $("<p>")
        .text(
            "Created by: " +
            event.ownerUsername
        )
        .appendTo(card);


    const actions =
        $("<div>")
            .addClass(
                "form-actions"
            );


    if (
        user.role === "student" &&
        event.ownerUsername !==
            user.username
    ) {

        $("<a>")
            .addClass("primary-button")
            .attr(
                "href",
                "register.html?eventId=" +
                event.id
            )
            .text("Register")
            .appendTo(actions);

    }


    if (
        canManageEvent(
            event,
            user
        )
    ) {

        $("<a>")
            .addClass(
                "secondary-button"
            )
            .attr(
                "href",
                "event-form.html?id=" +
                event.id
            )
            .text("Edit")
            .appendTo(actions);


        const deleteButton =
            $("<button>")
                .addClass(
                    "danger-button"
                )
                .text("Delete");


        deleteButton.on(
            "click",
            function () {

                if (
                    !confirm(
                        "Delete this event?"
                    )
                ) {
                    return;
                }


                if (
                    deleteEvent(event.id)
                ) {

                    window.location.href =
                        "../index.html";

                }

            }
        );


        actions.append(
            deleteButton
        );

    }


    if (
        user.role === "guest"
    ) {

        $("<p>")
            .text(
                "Login as a student to register."
            )
            .appendTo(actions);

    }


    card.append(actions);

    container.append(card);

    card.hide().fadeIn(300);

});

</script>

</body>
</html>
