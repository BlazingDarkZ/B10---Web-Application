<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Event - Campus Hub</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>


<header class="site-header">

    <nav class="navbar">

        <a
            href="../index.html"
            class="logo"
        >
            CAMPUS<span>HUB</span>
        </a>

        <div class="nav-links">

            <a href="../index.html">
                Events
            </a>

            <a href="my-registrations.html">
                My Registrations
            </a>

        </div>

    </nav>

</header>


<main>

    <section class="events-section">

        <div class="container">

            <div class="form-card">

                <p class="eyebrow">
                    ORGANIZER
                </p>

                <h1 id="formTitle">
                    Create Event
                </h1>


                <form id="eventForm">

                    <div class="form-group">

                        <label for="title">
                            Event title
                        </label>

                        <input
                            type="text"
                            id="title"
                            maxlength="100"
                            required
                        >

                        <span
                            class="form-error"
                            id="titleError"
                        ></span>

                    </div>


                    <div class="form-group">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            maxlength="500"
                            required
                        ></textarea>

                        <span
                            class="form-error"
                            id="descriptionError"
                        ></span>

                    </div>


                    <div class="form-group">

                        <label for="date">
                            Date
                        </label>

                        <input
                            type="date"
                            id="date"
                            required
                        >

                        <span
                            class="form-error"
                            id="dateError"
                        ></span>

                    </div>


                    <div class="form-group">

                        <label for="time">
                            Time
                        </label>

                        <input
                            type="time"
                            id="time"
                            required
                        >

                        <span
                            class="form-error"
                            id="timeError"
                        ></span>

                    </div>


                    <div class="form-group">

                        <label for="location">
                            Location
                        </label>

                        <input
                            type="text"
                            id="location"
                            maxlength="100"
                            required
                        >

                        <span
                            class="form-error"
                            id="locationError"
                        ></span>

                    </div>


                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <select
                            id="category"
                            required
                        >

                            <option value="">
                                Select category
                            </option>

                            <option value="Workshop">
                                Workshop
                            </option>

                            <option value="Seminar">
                                Seminar
                            </option>

                            <option value="Lecture">
                                Lecture
                            </option>

                            <option value="Social">
                                Social
                            </option>

                        </select>

                        <span
                            class="form-error"
                            id="categoryError"
                        ></span>

                    </div>


                    <div class="form-group">

                        <label for="department">
                            Department
                        </label>

                        <select
                            id="department"
                            required
                        >

                            <option value="">
                                Select department
                            </option>

                            <option value="Computer Science">
                                Computer Science
                            </option>

                            <option value="Business">
                                Business
                            </option>

                            <option value="Arts">
                                Arts
                            </option>

                            <option value="Library">
                                Library
                            </option>

                            <option value="International Office">
                                International Office
                            </option>

                        </select>

                        <span
                            class="form-error"
                            id="departmentError"
                        ></span>

                    </div>


                    <div class="form-actions">

                        <button
                            type="submit"
                            class="primary-button"
                        >
                            Save Event
                        </button>

                        <a
                            href="../index.html"
                            class="secondary-button event-link"
                        >
                            Cancel
                        </a>

                    </div>


                    <p
                        id="formMessage"
                        class="form-success"
                        aria-live="polite"
                    ></p>

                </form>

            </div>

        </div>

    </section>

</main>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/app.js"></script>


<script>

$(document).ready(function () {

    if (currentUser.role !== "organizer") {

        $("#eventForm").hide();

        $("#formTitle")
            .text(
                "Organizer access required"
            );

        return;
    }


    const parameters =
        new URLSearchParams(
            window.location.search
        );


    const eventId =
        Number(
            parameters.get("id")
        );


    const editing =
        Boolean(eventId);


    if (editing) {

        $("#formTitle")
            .text("Edit Event");


        const event =
            events.find(function (item) {

                return item.id === eventId;

            });


        if (!event) {

            $("#formTitle")
                .text("Event not found");

            $("#eventForm").hide();

            return;
        }


        if (
            event.organizerId !==
            currentUser.id
        ) {

            $("#formTitle")
                .text(
                    "You cannot edit this event"
                );

            $("#eventForm").hide();

            return;
        }


        $("#title").val(event.title);

        $("#description")
            .val(event.description);

        $("#date").val(event.date);

        $("#time").val(event.time);

        $("#location")
            .val(event.location);

        $("#category")
            .val(event.category);

        $("#department")
            .val(event.department);

    }


    $("#eventForm").on(
        "submit",
        function (event) {

            event.preventDefault();


            $(".form-error").text("");

            let valid = true;


            const title =
                $("#title").val().trim();


            const description =
                $("#description")
                    .val()
                    .trim();


            const date =
                $("#date").val();


            const time =
                $("#time").val();


            const location =
                $("#location")
                    .val()
                    .trim();


            const category =
                $("#category").val();


            const department =
                $("#department").val();


            if (
                title.length < 3
            ) {

                $("#titleError")
                    .text(
                        "Title must be at least 3 characters."
                    );

                valid = false;
            }


            if (
                description.length < 10
            ) {

                $("#descriptionError")
                    .text(
                        "Description must be at least 10 characters."
                    );

                valid = false;
            }


            if (!date) {

                $("#dateError")
                    .text(
                        "Please select a date."
                    );

                valid = false;
            }


            if (!time) {

                $("#timeError")
                    .text(
                        "Please select a time."
                    );

                valid = false;
            }


            if (
                location.length < 2
            ) {

                $("#locationError")
                    .text(
                        "Please enter a location."
                    );

                valid = false;
            }


            if (!category) {

                $("#categoryError")
                    .text(
                        "Please select a category."
                    );

                valid = false;
            }


            if (!department) {

                $("#departmentError")
                    .text(
                        "Please select a department."
                    );

                valid = false;
            }


            if (!valid) {
                return;
            }


            const eventData = {

                title: title,

                description:
                    description,

                date: date,

                time: time,

                location:
                    location,

                category:
                    category,

                department:
                    department
            };


            if (editing) {

                updateEvent(
                    eventId,
                    eventData
                );

                $("#formMessage")
                    .text(
                        "Event updated successfully."
                    );

            } else {

                createEvent(
                    eventData
                );

                $("#formMessage")
                    .text(
                        "Event created successfully."
                    );

                $("#eventForm")[0].reset();

            }

        }
    );

});

</script>

</body>

</html>
