<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - CampusHub</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >
</head>

<body>

<header class="site-header">

    <nav class="navbar">

        <a
            href="../index.html"
            class="logo"
        >
            CAMPUS<span>HUB</span>
        </a>

        <div class="nav-links">

            <a href="../index.html">
                Events
            </a>

        </div>

    </nav>

</header>


<main>

<section class="events-section">

<div class="container">


<div class="form-card">

    <p class="eyebrow">
        ACCOUNT
    </p>

    <h1>
        Login
    </h1>


    <form
        id="loginForm"
        novalidate
    >

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                maxlength="30"
                autocomplete="username"
                required
            >

            <p
                id="usernameError"
                class="form-error"
            ></p>

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                maxlength="72"
                autocomplete="current-password"
                required
            >

            <p
                id="passwordError"
                class="form-error"
            ></p>

        </div>


        <p
            id="loginError"
            class="form-error"
        ></p>


        <button
            type="submit"
            class="primary-button"
        >
            Login
        </button>

    </form>


    <hr>


    <h2>
        Create Student Account
    </h2>


    <form
        id="registerForm"
        novalidate
    >

        <div class="form-group">

            <label for="newUsername">
                Username
            </label>

            <input
                type="text"
                id="newUsername"
                maxlength="30"
                required
            >

            <p
                id="newUsernameError"
                class="form-error"
            ></p>

        </div>


        <div class="form-group">

            <label for="newPassword">
                Password
            </label>

            <input
                type="password"
                id="newPassword"
                maxlength="72"
                required
            >

            <p
                id="newPasswordError"
                class="form-error"
            ></p>

        </div>


        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                maxlength="72"
                required
            >

            <p
                id="confirmPasswordError"
                class="form-error"
            ></p>

        </div>


        <p
            id="registerMessage"
            class="form-success"
        ></p>


        <button
            type="submit"
            class="secondary-button"
        >
            Create Account
        </button>

    </form>

</div>


</div>

</section>

</main>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="../js/security.js"></script>
<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>


<script>

$(document).ready(function () {


    $("#loginForm").on(
        "submit",
        function (event) {

            event.preventDefault();

            $(".form-error").text("");


            const rawUsername =
                $("#username").val();

            const password =
                $("#password").val();


            if (
                !isSafeInput(rawUsername)
            ) {

                $("#usernameError").text(
                    "Invalid username."
                );

                return;

            }


            const username =
                sanitizeInput(
                    rawUsername
                );


            if (
                !isValidUsername(
                    username
                )
            ) {

                $("#usernameError").text(
                    "Username must contain 3-30 letters, numbers, underscores or hyphens."
                );

                return;

            }


            if (
                password.length < 1 ||
                password.length > 72
            ) {

                $("#passwordError").text(
                    "Please enter your password."
                );

                return;

            }


            if (
                !login(
                    username,
                    password
                )
            ) {

                $("#loginError").text(
                    "Invalid username or password."
                );

                return;

            }


            window.location.href =
                "../index.html";

        }
    );


    $("#registerForm").on(
        "submit",
        function (event) {

            event.preventDefault();

            $(".form-error").text("");

            $("#registerMessage").text("");


            const rawUsername =
                $("#newUsername").val();

            const password =
                $("#newPassword").val();

            const confirm =
                $("#confirmPassword").val();


            if (
                !isSafeInput(rawUsername)
            ) {

                $("#newUsernameError").text(
                    "Invalid username."
                );

                return;

            }


            const username =
                sanitizeInput(
                    rawUsername
                );


            if (
                !isValidUsername(
                    username
                )
            ) {

                $("#newUsernameError").text(
                    "Username must contain 3-30 letters, numbers, underscores or hyphens."
                );

                return;

            }


            if (
                password.length < 8 ||
                password.length > 72
            ) {

                $("#newPasswordError").text(
                    "Password must contain 8-72 characters."
                );

                return;

            }


            if (
                password !== confirm
            ) {

                $("#confirmPasswordError").text(
                    "Passwords do not match."
                );

                return;

            }


            if (
                !registerStudent(
                    username,
                    password
                )
            ) {

                $("#newUsernameError").text(
                    "Username already exists."
                );

                return;

            }


            $("#registerForm")[0].reset();


            $("#registerMessage")
                .hide()
                .text(
                    "Account created. You can now log in."
                )
                .fadeIn(300);

        }
    );

});

</script>

</body>
</html>
