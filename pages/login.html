<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - CampusHub</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>


<header class="site-header">

    <nav class="navbar">

        <a
            href="../index.html"
            class="logo"
        >
            CAMPUS<span>HUB</span>
        </a>


        <div class="nav-links">

            <a href="../index.html">
                Events
            </a>

            <a href="my-registrations.html">
                My Registrations
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

        </div>

    </nav>

</header>


<main>

<section class="events-section">

<div class="container">


<div class="form-card">

    <p class="eyebrow">
        ACCOUNT
    </p>

    <h1>
        Login
    </h1>

    <p>
        Students can log in using their CampusHub
        username and password.
    </p>


    <form id="loginForm" novalidate>


        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                maxlength="30"
                autocomplete="username"
                required
            >

            <p
                id="usernameError"
                class="form-error"
            ></p>

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                maxlength="72"
                autocomplete="current-password"
                required
            >

            <p
                id="passwordError"
                class="form-error"
            ></p>

        </div>


        <p
            id="loginError"
            class="form-error"
        ></p>


        <div class="form-actions">

            <button
                type="submit"
                class="primary-button"
            >
                Login
            </button>

        </div>

    </form>


    <hr>


    <h2>
        New Student?
    </h2>

    <p>
        Create a student account below.
    </p>


    <form
        id="registerForm"
        novalidate
    >


        <div class="form-group">

            <label for="newUsername">
                Username
            </label>

            <input
                type="text"
                id="newUsername"
                name="newUsername"
                maxlength="30"
                autocomplete="username"
                required
            >

            <p
                id="newUsernameError"
                class="form-error"
            ></p>

        </div>


        <div class="form-group">

            <label for="newPassword">
                Password
            </label>

            <input
                type="password"
                id="newPassword"
                name="newPassword"
                maxlength="72"
                autocomplete="new-password"
                required
            >

            <p
                id="newPasswordError"
                class="form-error"
            ></p>

        </div>


        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                maxlength="72"
                autocomplete="new-password"
                required
            >

            <p
                id="confirmPasswordError"
                class="form-error"
            ></p>

        </div>


        <p
            id="registerSuccess"
            class="form-success"
        ></p>


        <div class="form-actions">

            <button
                type="submit"
                class="secondary-button"
            >
                Create Student Account
            </button>

        </div>

    </form>


</div>


</div>

</section>

</main>


<footer class="site-footer">

<div class="container">

    <strong class="footer-logo">
        CAMPUS<span>HUB</span>
    </strong>

    <p>
        University events and workshops.
    </p>

    <p class="copyright">
        CampusHub student project.
    </p>

</div>

</footer>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="../js/data.js"></script>

<script src="../js/storage.js"></script>


<script>

$(document).ready(function () {


    /*
        LOGIN
    */

    $("#loginForm").on(
        "submit",
        function (event) {

            event.preventDefault();


            $(".form-error").text("");

            $("#registerSuccess").text("");


            const username =
                $("#username")
                    .val()
                    .trim();


            const password =
                $("#password")
                    .val();


            let valid = true;


            if (!isValidUsername(username)) {

                $("#usernameError").text(
                    "Enter a valid username using 3-30 letters, numbers, underscores or hyphens."
                );

                valid = false;
            }


            if (
                password.length < 1 ||
                password.length > 72
            ) {

                $("#passwordError").text(
                    "Please enter your password."
                );

                valid = false;
            }


            if (!valid) {
                return;
            }


            const users = getUsers();


            const user = users.find(
                function (account) {

                    return (
                        account.username === username &&
                        account.password === password
                    );

                }
            );


            if (!user) {

                $("#loginError").text(
                    "Invalid username or password."
                );

                return;
            }


            saveCurrentUser({

                username: user.username,

                role: user.role

            });


            window.location.href =
                "../index.html";

        }
    );


    /*
        STUDENT REGISTRATION
    */

    $("#registerForm").on(
        "submit",
        function (event) {

            event.preventDefault();


            $(".form-error").text("");

            $("#registerSuccess").text("");


            const username =
                $("#newUsername")
                    .val()
                    .trim();


            const password =
                $("#newPassword")
                    .val();


            const confirmPassword =
                $("#confirmPassword")
                    .val();


            let valid = true;


            /*
                Username validation
            */

            if (!isValidUsername(username)) {

                $("#newUsernameError").text(
                    "Username must be 3-30 characters and use only letters, numbers, underscores or hyphens."
                );

                valid = false;
            }


            /*
                Password validation
            */

            if (
                password.length < 8 ||
                password.length > 72
            ) {

                $("#newPasswordError").text(
                    "Password must contain 8-72 characters."
                );

                valid = false;
            }


            /*
                Confirm password
            */

            if (
                password !== confirmPassword
            ) {

                $("#confirmPasswordError").text(
                    "Passwords do not match."
                );

                valid = false;
            }


            if (!valid) {
                return;
            }


            const users = getUsers();


            const exists = users.some(
                function (user) {

                    return (
                        user.username.toLowerCase() ===
                        username.toLowerCase()
                    );

                }
            );


            if (exists) {

                $("#newUsernameError").text(
                    "That username is already taken."
                );

                return;
            }


            /*
                All self-created accounts
                are students.
            */

            users.push({

                username: username,

                password: password,

                role: "student"

            });


            saveUsers(users);


            $("#registerForm")[0].reset();


            $("#registerSuccess").text(
                "Student account created. You can now log in."
            );

        }
    );


    /*
        Username safety check
    */

    function isValidUsername(username) {

        return /^[A-Za-z0-9_-]{3,30}$/.test(
            username
        );

    }


});

</script>


</body>

</html>
