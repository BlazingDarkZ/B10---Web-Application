<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Users - CampusHub</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >
</head>

<body>

<header class="site-header">

    <nav class="navbar">

        <a
            href="../index.html"
            class="logo"
        >
            CAMPUS<span>HUB</span>
        </a>

        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="../index.html">
                Events
            </a>

        </div>

    </nav>

</header>


<main>

<section class="events-section">

<div class="container">

    <p class="eyebrow">
        ADMIN
    </p>

    <h1>
        Manage Users
    </h1>


    <div id="userList"></div>

</div>

</section>

</main>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="../js/security.js"></script>
<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>


<script>

$(document).ready(function () {

    const currentUser =
        getCurrentUser();


    const container =
        $("#userList");


    if (
        currentUser.role !== "admin"
    ) {

        container.append(
            $("<p>")
                .text(
                    "Access denied. Admin only."
                )
        );

        return;

    }


    function displayUsers() {

        container.empty();


        const users =
            getUsers();


        users.forEach(
            function (user) {

                const card =
                    $("<article>")
                        .addClass(
                            "registration-item"
                        );


                $("<h2>")
                    .text(user.username)
                    .appendTo(card);


                $("<p>")
                    .text(
                        "Role: " +
                        user.role
                    )
                    .appendTo(card);


                if (
                    user.username ===
                    currentUser.username
                ) {

                    $("<p>")
                        .text(
                            "You cannot change your own role."
                        )
                        .appendTo(card);


                    container.append(card);

                    return;

                }


                const select =
                    $("<select>");


                select.append(
                    $("<option>")
                        .val("student")
                        .text("Student")
                );


                select.append(
                    $("<option>")
                        .val("admin")
                        .text("Admin")
                );


                select.val(
                    user.role
                );


                const button =
                    $("<button>")
                        .addClass(
                            "primary-button"
                        )
                        .text(
                            "Save Role"
                        );


                button.on(
                    "click",
                    function () {

                        const users =
                            getUsers();


                        const account =
                            users.find(
                                function (item) {

                                    return (
                                        item.username ===
                                        user.username
                                    );

                                }
                            );


                        if (!account) {
                            return;
                        }


                        account.role =
                            select.val();


                        saveUsers(users);


                        displayUsers();

                    }
                );


                const actions =
                    $("<div>")
                        .addClass(
                            "form-actions"
                        );


                actions.append(
                    select,
                    button
                );


                card.append(actions);

                container.append(card);

            }
        );

    }


    displayUsers();

});

</script>

</body>
</html>
