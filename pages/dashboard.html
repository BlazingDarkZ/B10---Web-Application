<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard - CampusHub</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >
</head>

<body>

<header class="site-header">

    <nav class="navbar">

        <a
            href="../index.html"
            class="logo"
        >
            CAMPUS<span>HUB</span>
        </a>

        <div class="nav-links">

            <a href="../index.html">
                Events
            </a>

            <a
                href="event-form.html"
                id="createEventLink"
            >
                Create Event
            </a>

            <a
                href="users.html"
                id="adminUsersLink"
            >
                Manage Users
            </a>

        </div>

    </nav>

</header>


<main>

<section class="events-section">

<div class="container">

    <p class="eyebrow">
        DASHBOARD
    </p>

    <h1 id="dashboardTitle">
        My Events
    </h1>


    <div
        id="dashboardEvents"
        class="event-grid"
    ></div>

</div>

</section>

</main>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="../js/security.js"></script>
<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/events.js"></script>


<script>

$(document).ready(function () {

    const user =
        getCurrentUser();


    if (
        user.role !== "student" &&
        user.role !== "admin"
    ) {

        $("main").html(
            $("<section>")
                .addClass(
                    "events-section"
                )
                .append(
                    $("<div>")
                        .addClass(
                            "container"
                        )
                        .append(
                            $("<p>")
                                .text(
                                    "Please log in first."
                                )
                        )
                )
        );

        return;

    }


    if (
        user.role !== "admin"
    ) {

        $("#adminUsersLink").hide();

    } else {

        $("#dashboardTitle").text(
            "All Events"
        );

    }


    const events =
        getEvents();


    const displayedEvents =
        user.role === "admin"
            ? events
            : events.filter(
                function (event) {

                    return (
                        event.ownerUsername ===
                        user.username
                    );

                }
            );


    const container =
        $("#dashboardEvents");


    if (
        displayedEvents.length === 0
    ) {

        container.append(
            $("<p>")
                .text(
                    "No events found."
                )
        );

        return;

    }


    displayedEvents.forEach(
        function (event) {

            const card =
                $("<article>")
                    .addClass(
                        "event-card"
                    );


            $("<p>")
                .addClass("eyebrow")
                .text(event.category)
                .appendTo(card);


            $("<h2>")
                .text(event.title)
                .appendTo(card);


            $("<p>")
                .text(
                    event.date +
                    " · " +
                    event.time
                )
                .appendTo(card);


            $("<p>")
                .text(
                    "Created by: " +
                    event.ownerUsername
                )
                .appendTo(card);


            $("<a>")
                .addClass(
                    "secondary-button"
                )
                .attr(
                    "href",
                    "event-form.html?id=" +
                    event.id
                )
                .text("Edit")
                .appendTo(card);


            const remove =
                $("<button>")
                    .addClass(
                        "danger-button"
                    )
                    .text("Delete");


            remove.on(
                "click",
                function () {

                    if (
                        !confirm(
                            "Delete this event?"
                        )
                    ) {
                        return;
                    }


                    if (
                        deleteEvent(
                            event.id
                        )
                    ) {

                        window.location.reload();

                    }

                }
            );


            card.append(remove);

            container.append(card);

        }
    );

});

</script>

</body>
</html>
