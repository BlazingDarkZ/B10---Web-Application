<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Event Form - CampusHub</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >
</head>

<body>

<header class="site-header">

    <nav class="navbar">

        <a
            href="../index.html"
            class="logo"
        >
            CAMPUS<span>HUB</span>
        </a>

        <div class="nav-links">

            <a href="../index.html">
                Events
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

        </div>

    </nav>

</header>


<main>

<section class="events-section">

<div class="container">

<div class="form-card">

    <p class="eyebrow">
        EVENT
    </p>

    <h1 id="formTitle">
        Create Event
    </h1>


    <p
        id="accessError"
        class="form-error"
    ></p>


    <form
        id="eventForm"
        novalidate
    >

        <div class="form-group">

            <label for="title">
                Event Title
            </label>

            <input
                type="text"
                id="title"
                maxlength="100"
                required
            >

            <p
                id="titleError"
                class="form-error"
            ></p>

        </div>


        <div class="form-group">

            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                maxlength="500"
                required
            ></textarea>

            <p
                id="descriptionError"
                class="form-error"
            ></p>

        </div>


        <div class="form-group">

            <label for="date">
                Date
            </label>

            <input
                type="date"
                id="date"
                required
            >

            <p
                id="dateError"
                class="form-error"
            ></p>

        </div>


        <div class="form-group">

            <label for="time">
                Time
            </label>

            <input
                type="time"
                id="time"
                required
            >

            <p
                id="timeError"
                class="form-error"
            ></p>

        </div>


        <div class="form-group">

            <label for="location">
                Location
            </label>

            <input
                type="text"
                id="location"
                maxlength="100"
                required
            >

            <p
                id="locationError"
                class="form-error"
            ></p>

        </div>


        <div class="form-group">

            <label for="category">
                Category
            </label>

            <select
                id="category"
                required
            >

                <option value="">
                    Select Category
                </option>

                <option value="Workshop">
                    Workshop
                </option>

                <option value="Career">
                    Career
                </option>

                <option value="Social">
                    Social
                </option>

                <option value="Academic">
                    Academic
                </option>

            </select>

            <p
                id="categoryError"
                class="form-error"
            ></p>

        </div>


        <div class="form-group">

            <label for="department">
                Department
            </label>

            <select
                id="department"
                required
            >

                <option value="">
                    Select Department
                </option>

                <option value="Computer Science">
                    Computer Science
                </option>

                <option value="Business">
                    Business
                </option>

                <option value="Humanities">
                    Humanities
                </option>

                <option value="University">
                    University
                </option>

            </select>

            <p
                id="departmentError"
                class="form-error"
            ></p>

        </div>


        <p
            id="formError"
            class="form-error"
        ></p>


        <div class="form-actions">

            <button
                type="submit"
                class="primary-button"
            >
                Save Event
            </button>

            <a
                href="../index.html"
                class="secondary-button"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

</div>

</section>

</main>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="../js/security.js"></script>
<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/events.js"></script>


<script>

$(document).ready(function () {

    const user =
        getCurrentUser();


    if (
        user.role !== "student" &&
        user.role !== "admin"
    ) {

        $("#eventForm").hide();

        $("#accessError").text(
            "You must be logged in to manage events."
        );

        return;

    }


    const params =
        new URLSearchParams(
            window.location.search
        );


    const eventId =
        params.get("id");


    let editingEvent = null;


    if (eventId) {

        editingEvent =
            getEvents().find(
                function (event) {

                    return (
                        String(event.id) ===
                        String(eventId)
                    );

                }
            );


        if (!editingEvent) {

            $("#eventForm").hide();

            $("#accessError").text(
                "Event not found."
            );

            return;

        }


        if (
            !canManageEvent(
                editingEvent,
                user
            )
        ) {

            $("#eventForm").hide();

            $("#accessError").text(
                "You cannot edit this event."
            );

            return;

        }


        $("#formTitle").text(
            "Edit Event"
        );


        $("#title").val(
            editingEvent.title
        );

        $("#description").val(
            editingEvent.description
        );

        $("#date").val(
            editingEvent.date
        );

        $("#time").val(
            editingEvent.time
        );

        $("#location").val(
            editingEvent.location
        );

        $("#category").val(
            editingEvent.category
        );

        $("#department").val(
            editingEvent.department
        );

    }


    $("#eventForm").on(
        "submit",
        function (event) {

            event.preventDefault();

            $(".form-error").text("");


            const rawTitle =
                $("#title").val();

            const rawDescription =
                $("#description").val();

            const rawLocation =
                $("#location").val();


            if (
                !isSafeInput(rawTitle) ||
                !isSafeInput(rawDescription) ||
                !isSafeInput(rawLocation)
            ) {

                $("#formError").text(
                    "Your input contains invalid code."
                );

                return;

            }


            const title =
                sanitizeInput(rawTitle);

            const description =
                sanitizeInput(
                    rawDescription
                );

            const location =
                sanitizeInput(
                    rawLocation
                );

            const date =
                $("#date").val();

            const time =
                $("#time").val();

            const category =
                $("#category").val();

            const department =
                $("#department").val();


            let valid = true;


            if (
                title.length < 3 ||
                title.length > 100
            ) {

                $("#titleError").text(
                    "Title must contain 3-100 characters."
                );

                valid = false;

            }


            if (
                description.length < 10 ||
                description.length > 500
            ) {

                $("#descriptionError").text(
                    "Description must contain 10-500 characters."
                );

                valid = false;

            }


            if (!date) {

                $("#dateError").text(
                    "Please select a date."
                );

                valid = false;

            }


            if (!time) {

                $("#timeError").text(
                    "Please select a time."
                );

                valid = false;

            }


            if (
                location.length < 2 ||
                location.length > 100
            ) {

                $("#locationError").text(
                    "Location must contain 2-100 characters."
                );

                valid = false;

            }


            if (!category) {

                $("#categoryError").text(
                    "Please select a category."
                );

                valid = false;

            }


            if (!department) {

                $("#departmentError").text(
                    "Please select a department."
                );

                valid = false;

            }


            if (!valid) {
                return;
            }


            const eventData = {
                title: title,
                description: description,
                date: date,
                time: time,
                location: location,
                category: category,
                department: department
            };


            let success;


            if (editingEvent) {

                success =
                    updateEvent(
                        editingEvent.id,
                        eventData
                    );

            } else {

                success =
                    createEvent(
                        eventData
                    );

            }


            if (!success) {

                $("#formError").text(
                    "Unable to save event."
                );

                return;

            }


            window.location.href =
                "../index.html";

        }
    );

});

</script>

</body>
</html>
