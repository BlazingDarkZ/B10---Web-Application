<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Registrations</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >
</head>

<body>

<header class="site-header">

    <nav class="navbar">

        <a
            href="../index.html"
            class="logo"
        >
            CAMPUS<span>HUB</span>
        </a>

        <div class="nav-links">

            <a href="../index.html">
                Events
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

        </div>

    </nav>

</header>


<main>

<section class="events-section">

<div class="container">

    <p class="eyebrow">
        STUDENT
    </p>

    <h1>
        My Registrations
    </h1>


    <div id="registrationList"></div>

</div>

</section>

</main>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="../js/security.js"></script>
<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/registrations.js"></script>


<script>

$(document).ready(function () {

    const user =
        getCurrentUser();


    const container =
        $("#registrationList");


    if (
        user.role !== "student"
    ) {

        container.append(
            $("<p>")
                .text(
                    "Student login required."
                )
        );

        return;

    }


    function displayRegistrations() {

        container.empty();


        const registrations =
            getStudentRegistrations(
                user.username
            );


        if (
            registrations.length === 0
        ) {

            container.append(
                $("<p>")
                    .text(
                        "You have no registrations."
                    )
            );

            return;

        }


        registrations.forEach(
            function (registration) {

                const event =
                    getEvents().find(
                        function (item) {

                            return (
                                String(item.id) ===
                                String(
                                    registration.eventId
                                )
                            );

                        }
                    );


                if (!event) {
                    return;
                }


                const card =
                    $("<article>")
                        .addClass(
                            "registration-item"
                        );


                $("<h2>")
                    .text(event.title)
                    .appendTo(card);


                $("<p>")
                    .text(
                        "Name: " +
                        registration.name
                    )
                    .appendTo(card);


                $("<p>")
                    .text(
                        "Email: " +
                        registration.email
                    )
                    .appendTo(card);


                const actions =
                    $("<div>")
                        .addClass(
                            "registration-actions"
                        );


                const edit =
                    $("<button>")
                        .addClass(
                            "secondary-button"
                        )
                        .text(
                            "Edit Details"
                        );


                edit.on(
                    "click",
                    function () {

                        showEditForm(
                            registration
                        );

                    }
                );


                const cancel =
                    $("<button>")
                        .addClass(
                            "danger-button"
                        )
                        .text(
                            "Cancel"
                        );


                cancel.on(
                    "click",
                    function () {

                        if (
                            !confirm(
                                "Cancel this registration?"
                            )
                        ) {
                            return;
                        }


                        deleteRegistration(
                            registration.id
                        );


                        displayRegistrations();

                    }
                );


                actions.append(
                    edit,
                    cancel
                );


                card.append(actions);

                container.append(card);

            }
        );

    }


    function showEditForm(
        registration
    ) {

        container.empty();


        const form =
            $("<form>")
                .addClass(
                    "form-card"
                );


        $("<h2>")
            .text(
                "Edit Registration"
            )
            .appendTo(form);


        const name =
            $("<input>")
                .attr({
                    type: "text",
                    maxlength: 80
                })
                .val(
                    registration.name
                );


        const email =
            $("<input>")
                .attr({
                    type: "email",
                    maxlength: 120
                })
                .val(
                    registration.email
                );


        const nameLabel =
            $("<label>")
                .text("Full Name");


        const emailLabel =
            $("<label>")
                .text("Email");


        const nameGroup =
            $("<div>")
                .addClass(
                    "form-group"
                )
                .append(
                    nameLabel,
                    name
                );


        const emailGroup =
            $("<div>")
                .addClass(
                    "form-group"
                )
                .append(
                    emailLabel,
                    email
                );


        const error =
            $("<p>")
                .addClass(
                    "form-error"
                );


        const save =
            $("<button>")
                .attr(
                    "type",
                    "submit"
                )
                .addClass(
                    "primary-button"
                )
                .text(
                    "Save"
                );


        const back =
            $("<button>")
                .attr(
                    "type",
                    "button"
                )
                .addClass(
                    "secondary-button"
                )
                .text(
                    "Back"
                );


        back.on(
            "click",
            displayRegistrations
        );


        const actions =
            $("<div>")
                .addClass(
                    "form-actions"
                )
                .append(
                    save,
                    back
                );


        form.append(
            nameGroup,
            emailGroup,
            error,
            actions
        );


        form.on(
            "submit",
            function (event) {

                event.preventDefault();


                const rawName =
                    name.val();

                const rawEmail =
                    email.val();


                if (
                    !isSafeInput(rawName) ||
                    !isSafeInput(rawEmail)
                ) {

                    error.text(
                        "Invalid input."
                    );

                    return;

                }


                const safeName =
                    sanitizeInput(
                        rawName
                    );

                const safeEmail =
                    sanitizeInput(
                        rawEmail
                    );


                if (
                    safeName.length < 2
                ) {

                    error.text(
                        "Enter a valid name."
                    );

                    return;

                }


                if (
                    !isValidEmail(
                        safeEmail
                    )
                ) {

                    error.text(
                        "Enter a valid email."
                    );

                    return;

                }


                updateRegistration(
                    registration.id,
                    safeName,
                    safeEmail
                );


                displayRegistrations();

            }
        );


        container.append(form);

    }


    displayRegistrations();

});

</script>

</body>
</html>
